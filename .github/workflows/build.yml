name: Build MYSAFELEX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # L'image ubuntu-latest actuelle ne fournit plus les "command line tools"
      # Android (sdkmanager), d'où l'échec du setup-android@v3 : on installe
      # nous-mêmes les outils de ligne de commande publiés par Google.
      - name: Install Android SDK
        run: |
          set -e
          if [ -z "$ANDROID_SDK_ROOT" ] && [ -z "$ANDROID_HOME" ]; then
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          fi
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip -d .
          rm -rf latest && mv cmdline-tools latest
          # $GITHUB_PATH / $GITHUB_ENV ne s'appliquent qu'aux ETAPES SUIVANTES :
          # on met donc aussi le PATH à jour dans l'etape courante.
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/local.properties"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYSAFELEX-App
          path: app/build/outputs/apk/debug/app-debug.apk
